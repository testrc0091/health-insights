name: Build, test, and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # `npm ci` requires a committed package-lock.json, which this repo doesn't have
      # yet (no one has run `npm install` anywhere so far). `npm install` works
      # without one. Once a lockfile is generated and committed, switch this back to
      # `npm ci` (and restore `cache: "npm"` above) for faster, fully reproducible
      # builds.
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  build-and-deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      # Repo name -> Pages subpath. If you rename the GitHub repo, update this line
      # (and the fallback in vite.config.ts) to match.
      - run: npm run build
        env:
          VITE_BASE_PATH: /health-insights/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
